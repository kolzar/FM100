name: Build, Test & Deploy

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish Windows x64 EXE
        run: dotnet publish FM100/FM100.csproj --configuration Release --runtime win-x64 --self-contained true /p:PublishSingleFile=true /p:UseAppHost=true --output ./publish

      - name: Zip release
        run: Compress-Archive -Path ./publish/* -DestinationPath ./release-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-win-x64
          path: ./release-win-x64.zip
          retention-days: 5

  deploy:
    name: Deploy Release
    needs: build-and-test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: release-win-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-win-x64.zip
          draft: false
          prerelease: false